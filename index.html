<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Tajwid Interaktif - Surah Al-Ikhlas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    /* Container Card Mushaf */
    .mushaf-card {
      position: relative;
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border: 3px solid #b91c1c;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .mushaf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      border-bottom: 2px solid #b91c1c;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      background-color: #fdfbf7;
    }

    .header-badge {
      border: 1px solid #ccc;
      padding: 2px 10px;
      border-radius: 12px;
      background: #fff;
    }

    /* Wrapper Gambar & Layer SVG */
    .mushaf-container {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .mushaf-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* SVG Overlay Terkunci Presisi */
    .svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* Style Area Klik */
    .verse-box {
      fill: rgba(13, 148, 136, 0.25);
      stroke: #0d9488;
      stroke-width: 2;
      stroke-dasharray: 6 4;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      rx: 5px;
      ry: 5px;
    }

    .verse-box:hover {
      fill: rgba(13, 148, 136, 0.5) !important;
      stroke-width: 3;
    }

    .verse-box.playing {
      fill: rgba(234, 179, 8, 0.65) !important;
      stroke: #ca8a04 !important;
      stroke-dasharray: none;
    }

    .verse-text {
      fill: #ffffff;
      font-size: 18px;
      font-weight: bold;
      font-family: sans-serif;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>

  <div id="mushaf-section">
    <div class="mushaf-card">
      <div class="mushaf-header">
        <span class="header-badge">112. Al-Ikhlāṣ</span>
        <span class="header-badge">Hal. 604</span>
        <span class="header-badge">Juz 30</span>
      </div>

      <div class="mushaf-container">
        <img id="mushaf-img" class="mushaf-img" 
             src="https://android.quran.com/data/width_1024/page604.png" 
             alt="Mushaf Halaman 604">

        <!-- SVG dengan ViewBox Asli Gambar 1024x1460 untuk Mengunci Posisi Pixel -->
        <svg id="svg-overlay" class="svg-overlay" viewBox="0 0 1024 1460"></svg>
      </div>
    </div>
  </div>

  <script>
     const SUPABASE_URL = 'https://wltnavoogxvoymhcdfwz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdG5hdm9vZ3h2b3ltaGNkZnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTE3ODEsImV4cCI6MjEwNTI4Nzc4MX0.7B7TdYafWjuRMOrInLo_u8f0d_WwRizqzdzABTITfpI';


    let supabaseClient = null;
    if (SUPABASE_KEY && !SUPABASE_KEY.includes('ISI_ANON_KEY')) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let currentAudio = null;

    // KOORDINAT BARU LENGKAP & PRESISI PAS DI ATAS BACAAN AL-IKHLAS
    const ikhlasVerses = [
      { surah: 112, ayah: 0, x: 110, y: 200, w: 804, h: 70, label: "Bismillah" },
      { surah: 112, ayah: 1, x: 110, y: 275, w: 804, h: 75, label: "Ayat 1" },
      { surah: 112, ayah: 2, x: 110, y: 355, w: 804, h: 75, label: "Ayat 2" },
      { surah: 112, ayah: 3, x: 110, y: 435, w: 804, h: 75, label: "Ayat 3" },
      { surah: 112, ayah: 4, x: 110, y: 515, w: 804, h: 75, label: "Ayat 4" }
    ];

    function renderClickableAreas() {
      const svg = document.getElementById('svg-overlay');
      svg.innerHTML = '';

      ikhlasVerses.forEach(item => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        
        // Kotak Overlay
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', item.x);
        rect.setAttribute('y', item.y);
        rect.setAttribute('width', item.w);
        rect.setAttribute('height', item.h);
        rect.setAttribute('class', 'verse-box');
        rect.setAttribute('data-verse', `${item.surah}:${item.ayah}`);

        // Badge Tag Label
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        badge.setAttribute('x', item.x + 10);
        badge.setAttribute('y', item.y + (item.h / 2) - 15);
        badge.setAttribute('width', 85);
        badge.setAttribute('height', 30);
        badge.setAttribute('rx', 5);
        badge.setAttribute('fill', 'rgba(0, 0, 0, 0.75)');

        // Teks Label
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', item.x + 52);
        text.setAttribute('y', item.y + (item.h / 2) + 2);
        text.setAttribute('class', 'verse-text');
        text.textContent = item.label;

        g.addEventListener('click', () => {
          highlightVerse(item.surah, item.ayah);
          playAudioAyat(item.surah, item.ayah);
        });

        g.appendChild(rect);
        g.appendChild(badge);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    async function playAudioAyat(surahNumber, ayahNumber) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      let audioSrc = null;

      // 1. Menggunakan Public URL Supabase
      if (supabaseClient) {
        try {
          const { data } = supabaseClient
            .storage
            .from('quran-audio')
            .getPublicUrl(`${surahNumber}/${ayahNumber}.mp3`);

          if (data?.publicUrl) {
            audioSrc = data.publicUrl;
          }
        } catch (e) {
          console.warn("Supabase Error, beralih ke CDN...", e);
        }
      }

      // 2. Fallback CDN Otomatis Jika Supabase Belum Dikonfigurasi
      if (!audioSrc || audioSrc.includes('undefined')) {
        if (ayahNumber === 0) {
          audioSrc = 'https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3';
        } else {
          const globalAyahId = 6221 + (ayahNumber - 1);
          audioSrc = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalAyahId}.mp3`;
        }
      }

      currentAudio = new Audio(audioSrc);
      currentAudio.play().catch(err => {
        console.error("Gagal memutar audio, menggunakan fallback CDN...", err);
        // Fallback paksa jika URL Supabase di-block/404
        const fallbackId = ayahNumber === 0 ? 1 : 6221 + (ayahNumber - 1);
        currentAudio = new Audio(`https://cdn.islamic.network/quran/audio/128/ar.alafasy/${fallbackId}.mp3`);
        currentAudio.play();
      });
    }

    function highlightVerse(surah, ayah) {
      document.querySelectorAll('.verse-box').forEach(el => el.classList.remove('playing'));
      const activeEl = document.querySelector(`.verse-box[data-verse="${surah}:${ayah}"]`);
      if (activeEl) {
        activeEl.classList.add('playing');
      }
    }

    renderClickableAreas();
  </script>

</body>
</html>

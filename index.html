<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Tajwid Interaktif - Surah Al-Ikhlas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    /* Form Login */
    .auth-container {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      max-width: 360px;
      margin: 40px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .auth-container input {
      width: 80%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 4px;
      border: 1px solid #444;
      background: #333;
      color: #fff;
    }
    .auth-container button {
      padding: 10px 20px;
      background-color: #0d9488;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    .auth-container button:hover { background-color: #0f766e; }

    /* Frame Utama Mushaf */
    .mushaf-card {
      position: relative;
      display: inline-block;
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      border: 2px solid #b91c1c;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* Header Latin */
    .mushaf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      border-bottom: 2px solid #b91c1c;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      background-color: #fdfbf7;
    }
    .header-badge {
      border: 1px solid #ccc;
      padding: 2px 10px;
      border-radius: 12px;
      background: #fff;
    }

    /* Gambar Mushaf Tajwid */
    .mushaf-img {
      width: 100%;
      height: auto;
      display: block;
      min-height: 500px;
      background-color: #fff;
    }

    /* SVG Overlay Area Klik */
    .svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* Polygon / Rectangle Area Klik Ayat */
    .verse-box {
      fill: rgba(0, 0, 0, 0);
      stroke: none;
      cursor: pointer;
      transition: fill 0.2s ease;
    }
    .verse-box:hover {
      fill: rgba(13, 148, 136, 0.35); /* Sorotan hijau transparan saat dihover */
    }
    .verse-box.playing {
      fill: rgba(255, 235, 59, 0.5) !important; /* Sorotan kuning saat suara diputar */
    }
  </style>
</head>
<body>

  <!-- 1. Form Login -->
  <div id="auth-section" class="auth-container">
    <h3>Login Aplikasi Al-Qur'an</h3>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <br>
    <button onclick="login()">Login</button>
  </div>

  <!-- 2. Tampilan Mushaf -->
  <div id="mushaf-section" style="display: none;">
    <div class="mushaf-card">
      <div class="mushaf-header">
        <span class="header-badge">112. Al-Ikhlāṣ</span>
        <span class="header-badge">604</span>
        <span class="header-badge">Juz 30</span>
      </div>

      <div style="position: relative;">
        <!-- Gambar Mushaf Halaman 604 -->
        <img id="mushaf-img" class="mushaf-img" 
             src="https://android.quran.com/data/width_1024/page604.png" 
             alt="Mushaf Halaman 604">

        <!-- Layer SVG Overlay Presisi -->
        <svg id="svg-overlay" class="svg-overlay" viewBox="0 0 1000 1420"></svg>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // ISI DUA VARIABEL DI BAWAH INI DENGAN DATA SUPABASE KAMU
    // =========================================================
    const SUPABASE_URL = 'https://wltnavoogxvoymhcdfwz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdG5hdm9vZ3h2b3ltaGNkZnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTE3ODEsImV4cCI6MjEwNTI4Nzc4MX0.7B7TdYafWjuRMOrInLo_u8f0d_WwRizqzdzABTITfpI';


    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentAudio = null;

    // Koordinat presisi area klik Surah Al-Ikhlas (Ayat 1 s/d 4) pada gambar Halaman 604
    const ikhlasCoordinates = [
      { surah: 112, ayah: 1, x: 230, y: 340, width: 680, height: 85 }, // Ayat 1
      { surah: 112, ayah: 2, x: 100, y: 340, width: 130, height: 85 }, // Ayat 2 (Bagian kanan)
      { surah: 112, ayah: 2, x: 550, y: 430, width: 350, height: 85 }, // Ayat 2 (Sambungan kiri)
      { surah: 112, ayah: 3, x: 100, y: 430, width: 450, height: 85 }, // Ayat 3
      { surah: 112, ayah: 4, x: 100, y: 520, width: 800, height: 85 }  // Ayat 4
    ];

    // Fungsi Login
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Login Gagal: ' + error.message);
      } else {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('mushaf-section').style.display = 'block';
        renderClickableAreas();
      }
    }

    // Render Area Klik Interaktif di Atas Gambar
    function renderClickableAreas() {
      const svgContainer = document.getElementById('svg-overlay');
      svgContainer.innerHTML = '';

      ikhlasCoordinates.forEach(item => {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', item.x);
        rect.setAttribute('y', item.y);
        rect.setAttribute('width', item.width);
        rect.setAttribute('height', item.height);
        rect.setAttribute('class', 'verse-box');
        rect.setAttribute('data-ayah', `${item.surah}:${item.ayah}`);

        rect.addEventListener('click', () => {
          highlightVerse(item.surah, item.ayah);
          playAudioAyat(item.surah, item.ayah);
        });

        svgContainer.appendChild(rect);
      });
    }

    // Putar Audio dari Supabase Storage
    async function playAudioAyat(surahNumber, ayahNumber) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      const folderSurah = String(surahNumber).padStart(3, '0');
      const filePath = `${folderSurah}/${ayahNumber}.mp3`;

      const { data, error } = await supabaseClient
        .storage
        .from('quran-audio')
        .createSignedUrl(filePath, 60);

      if (error) {
        alert('Gagal memuat audio dari Supabase: ' + error.message);
        return;
      }

      currentAudio = new Audio(data.signedUrl);
      currentAudio.play();
    }

    // Highlight Warna Kuning Saat Ayat Diputar
    function highlightVerse(surah, ayah) {
      document.querySelectorAll('.verse-box').forEach(el => el.classList.remove('playing'));
      document.querySelectorAll(`.verse-box[data-ayah="${surah}:${ayah}"]`).forEach(el => {
        el.classList.add('playing');
      });
    }
  </script>

</body>
</html>

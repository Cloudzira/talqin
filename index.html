<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Tajwid Interaktif - Surah Al-Ikhlas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    /* Container Utama Frame Mushaf */
    .mushaf-card {
      position: relative;
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 10px auto;
      background: #ffffff;
      border: 3px solid #b91c1c;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    /* Header Mushaf */
    .mushaf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      border-bottom: 2px solid #b91c1c;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      background-color: #fdfbf7;
    }
    .header-badge {
      border: 1px solid #ccc;
      padding: 2px 10px;
      border-radius: 12px;
      background: #fff;
    }

    /* Wrapper Gambar & Canvas Overlay */
    .mushaf-container {
      position: relative;
      width: 100%;
      line-height: 0;
      background-color: #fff;
    }

    .mushaf-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* SVG Overlay Presisi Scalable */
    .svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    /* Styling Box Area Klik Ayat */
    .verse-box {
      fill: rgba(13, 148, 136, 0.25);
      stroke: #0d9488;
      stroke-width: 2;
      stroke-dasharray: 6 4;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      rx: 6px;
      ry: 6px;
    }

    .verse-box:hover {
      fill: rgba(13, 148, 136, 0.5) !important;
      stroke-width: 3;
    }

    .verse-box.playing {
      fill: rgba(234, 179, 8, 0.65) !important;
      stroke: #ca8a04 !important;
      stroke-dasharray: none;
    }

    /* Label Text Dalam SVG */
    .verse-text {
      fill: #ffffff;
      font-size: 22px;
      font-weight: bold;
      font-family: sans-serif;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>

  <div id="mushaf-section">
    <div class="mushaf-card">
      <div class="mushaf-header">
        <span class="header-badge">112. Al-Ikhlāṣ</span>
        <span class="header-badge">Hal. 604</span>
        <span class="header-badge">Juz 30</span>
      </div>

      <div class="mushaf-container">
        <!-- Gambar Mushaf Halaman 604 -->
        <img id="mushaf-img" class="mushaf-img" 
             src="https://android.quran.com/data/width_1024/page604.png" 
             alt="Mushaf Halaman 604">

        <!-- Overlay SVG Scalable (ViewBox disesuaikan aspek rasio 1000x1420) -->
        <svg id="svg-overlay" class="svg-overlay" viewBox="0 0 1000 1420"></svg>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIG SUPABASE
    // Ganti SUPABASE_URL dengan URL Project Supabase Anda yang AKTIF dan BENAR
    // Contoh: 'https://xyzabcdefg.supabase.co'
    // =========================================================================
    const SUPABASE_URL = 'https://wltnavoogxvoymhcdfwz.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdG5hdm9vZ3h2b3ltaGNkZnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTE3ODEsImV4cCI6MjEwNTI4Nzc4MX0.7B7TdYafWjuRMOrInLo_u8f0d_WwRizqzdzABTITfpI';


    let supabaseClient = null;
    // Hanya menginisialisasi jika Key & URL valid
    if (SUPABASE_URL && SUPABASE_KEY) {
      try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } catch (e) {
        console.warn("Supabase Init Warning:", e);
      }
    }

    let currentAudio = null;

    // KOORDINAT PERSISI UNTUK SURAH AL-IKHLAS (Halaman 604)
    // Berdasarkan matriks viewBox 1000 x 1420
    const ikhlasVerses = [
      { surah: 112, ayah: 0, x: 100, y: 130, w: 800, h: 72, label: "Bismillah" },
      { surah: 112, ayah: 1, x: 100, y: 212, w: 800, h: 78, label: "Ayat 1" },
      { surah: 112, ayah: 2, x: 100, y: 298, w: 800, h: 78, label: "Ayat 2" },
      { surah: 112, ayah: 3, x: 100, y: 384, w: 800, h: 78, label: "Ayat 3" },
      { surah: 112, ayah: 4, x: 100, y: 470, w: 800, h: 78, label: "Ayat 4" }
    ];

    // Render Area Klik di Atas Gambar
    function renderClickableAreas() {
      const svg = document.getElementById('svg-overlay');
      svg.innerHTML = '';

      ikhlasVerses.forEach(item => {
        // Group SVG
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        
        // Rect Box
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', item.x);
        rect.setAttribute('y', item.y);
        rect.setAttribute('width', item.w);
        rect.setAttribute('height', item.h);
        rect.setAttribute('class', 'verse-box');
        rect.setAttribute('data-verse', `${item.surah}:${item.ayah}`);

        // Label Badge Background
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        badge.setAttribute('x', item.x + 10);
        badge.setAttribute('y', item.y + (item.h / 2) - 16);
        badge.setAttribute('width', 90);
        badge.setAttribute('height', 32);
        badge.setAttribute('rx', 6);
        badge.setAttribute('fill', 'rgba(0, 0, 0, 0.7)');

        // Label Text
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', item.x + 55);
        text.setAttribute('y', item.y + (item.h / 2) + 2);
        text.setAttribute('class', 'verse-text');
        text.textContent = item.label;

        // Event Listener
        g.addEventListener('click', () => {
          highlightVerse(item.surah, item.ayah);
          playAudioAyat(item.surah, item.ayah);
        });

        g.appendChild(rect);
        g.appendChild(badge);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    // Handled Audio Player dengan Pemanggilan Aman (No Broken Request)
    async function playAudioAyat(surahNumber, ayahNumber) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      let audioSrc = null;

      // 1. Ambil dari Supabase HANYA JIKA client aktif
      if (supabaseClient) {
        try {
          const filePath = `${surahNumber}/${ayahNumber}.mp3`;
          const { data, error } = await supabaseClient
            .storage
            .from('quran-audio')
            .createSignedUrl(filePath, 60);

          if (!error && data?.signedUrl) {
            audioSrc = data.signedUrl;
          }
        } catch (e) {
          // Silent fallback tanpa mengotori console
        }
      }

      // 2. Fallback CDN Publik jika Supabase tidak terhubung / error
      if (!audioSrc) {
        if (ayahNumber === 0) {
          audioSrc = 'https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3';
        } else {
          const globalAyahId = 6221 + (ayahNumber - 1); // Index Global Surah 112
          audioSrc = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalAyahId}.mp3`;
        }
      }

      // Play Audio
      currentAudio = new Audio(audioSrc);
      currentAudio.play().catch(err => console.log("Audio Play Interrupted:", err));
    }

    // Effect Highlighting
    function highlightVerse(surah, ayah) {
      document.querySelectorAll('.verse-box').forEach(el => el.classList.remove('playing'));
      const activeEl = document.querySelector(`.verse-box[data-verse="${surah}:${ayah}"]`);
      if (activeEl) {
        activeEl.classList.add('playing');
      }
    }

    // Inisialisasi
    renderClickableAreas();
  </script>

</body>
</html>

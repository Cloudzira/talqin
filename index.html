<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Tajwid Interaktif - Surah Al-Ikhlas</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    /* Card Container Mushaf */
    .mushaf-card {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 3px solid #b91c1c;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      margin: 10px auto;
    }

    .mushaf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      border-bottom: 2px solid #b91c1c;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      background-color: #fdfbf7;
    }
    .header-badge {
      border: 1px solid #ccc;
      padding: 2px 10px;
      border-radius: 12px;
      background: #fff;
    }

    /* Wrapper Gambar & Layer Overlay */
    .image-wrapper {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .mushaf-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Layer Tempat Area Klik */
    .overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: auto;
    }

    /* Area Klik Ayat */
    .clickable-verse {
      position: absolute;
      background-color: rgba(13, 148, 136, 0.2); /* Hijau transparan */
      border: 1px dashed rgba(13, 148, 136, 0.6);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clickable-verse:hover {
      background-color: rgba(13, 148, 136, 0.45) !important;
      border-color: #0d9488;
    }

    .clickable-verse.playing {
      background-color: rgba(234, 179, 8, 0.6) !important; /* Yellow highlight saat audio diputar */
      border: 2px solid #ca8a04;
    }

    .verse-label {
      font-size: 10px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      padding: 1px 5px;
      border-radius: 3px;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="mushaf-section">
    <div class="mushaf-card">
      <div class="mushaf-header">
        <span class="header-badge">112. Al-Ikhlāṣ</span>
        <span class="header-badge">Hal. 604</span>
        <span class="header-badge">Juz 30</span>
      </div>

      <div class="image-wrapper">
        <img id="mushaf-img" class="mushaf-img" 
             src="https://android.quran.com/data/width_1024/page604.png" 
             alt="Mushaf Halaman 604">

        <div id="overlay-layer" class="overlay-layer"></div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // ISIKAN DATA SUPABASE KAMU DI SINI
    // =========================================================
    const SUPABASE_URL = 'https://wltnavooqxyovmhcdfwz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdG5hdm9vZ3h2b3ltaGNkZnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTE3ODEsImV4cCI6MjEwNTI4Nzc4MX0.7B7TdYafWjuRMOrInLo_u8f0d_WwRizqzdzABTITfpI'; // Masukkan anon key Supabase di sini

    let supabaseClient = null;
    if (SUPABASE_KEY && !SUPABASE_KEY.includes('ISI_ANON_KEY')) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let currentAudio = null;

    // Coordination Area Klik Surah Al-Ikhlas (Halaman 604)
    const ikhlasVerses = [
      { surah: 112, ayah: 0, top: '9.8%', left: '11%', width: '78%', height: '5.2%', title: 'Bismillah' },
      { surah: 112, ayah: 1, top: '15.2%', left: '11%', width: '78%', height: '5.2%', title: 'Ayat 1' },
      { surah: 112, ayah: 2, top: '20.6%', left: '11%', width: '78%', height: '5.2%', title: 'Ayat 2' },
      { surah: 112, ayah: 3, top: '26.0%', left: '11%', width: '78%', height: '5.2%', title: 'Ayat 3' },
      { surah: 112, ayah: 4, top: '31.4%', left: '11%', width: '78%', height: '5.2%', title: 'Ayat 4' }
    ];

    // Render Tombol-Tombol Area Klik
    function renderClickableAreas() {
      const overlay = document.getElementById('overlay-layer');
      overlay.innerHTML = '';

      ikhlasVerses.forEach(item => {
        const div = document.createElement('div');
        div.className = 'clickable-verse';
        div.style.top = item.top;
        div.style.left = item.left;
        div.style.width = item.width;
        div.style.height = item.height;
        div.setAttribute('data-verse', `${item.surah}:${item.ayah}`);

        div.innerHTML = `<span class="verse-label">${item.title}</span>`;

        div.addEventListener('click', () => {
          highlightVerse(item.surah, item.ayah);
          playAudioAyat(item.surah, item.ayah);
        });

        overlay.appendChild(div);
      });
    }

    // Pemutaran Audio Sesuai Nama Folder Supabase (`112/0.mp3`, `112/1.mp3`, dst)
    async function playAudioAyat(surahNumber, ayahNumber) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      let audioSrc = null;

      if (supabaseClient) {
        try {
          // Menggunakan `112/${ayahNumber}.mp3` sesuai folder Supabase Storage
          const filePath = `${surahNumber}/${ayahNumber}.mp3`;

          const { data, error } = await supabaseClient
            .storage
            .from('quran-audio')
            .createSignedUrl(filePath, 60);

          if (!error && data?.signedUrl) {
            audioSrc = data.signedUrl;
          } else {
            console.warn("Audio Supabase tidak ditemukan, menggunakan CDN cadangan.", error);
          }
        } catch (e) {
          console.warn("Supabase Storage Error:", e);
        }
      }

      // Fallback CDN Publik jika Supabase belum dikonfigurasi / file tidak ditemukan
      if (!audioSrc) {
        if (ayahNumber === 0) {
          audioSrc = 'https://cdn.islamic.network/quran/audio/128/ar.alafasy/1.mp3'; // Audio Bismillah
        } else {
          const globalAyahId = 6221 + (ayahNumber - 1);
          audioSrc = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${globalAyahId}.mp3`;
        }
      }

      currentAudio = new Audio(audioSrc);
      currentAudio.play().catch(err => {
        console.error("Gagal memutar audio:", err);
      });
    }

    // Memberikan Efek Sorot Warna Kuning Saat Audio Diputar
    function highlightVerse(surah, ayah) {
      document.querySelectorAll('.clickable-verse').forEach(el => el.classList.remove('playing'));
      const activeEl = document.querySelector(`.clickable-verse[data-verse="${surah}:${ayah}"]`);
      if (activeEl) {
        activeEl.classList.add('playing');
      }
    }

    // Inisialisasi awal
    renderClickableAreas();
  </script>

</body>
</html>

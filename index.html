<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Interaktif - Dynamic JSON Coordinates</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .mushaf-card {
      position: relative;
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border: 3px solid #b91c1c;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .mushaf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 15px;
      border-bottom: 2px solid #b91c1c;
      font-weight: bold;
      font-size: 14px;
      color: #000;
      background-color: #fdfbf7;
    }

    .header-badge {
      border: 1px solid #ccc;
      padding: 2px 10px;
      border-radius: 12px;
      background: #fff;
    }

    .mushaf-container {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    .mushaf-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .svg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: auto;
    }

    .verse-box {
      fill: rgba(13, 148, 136, 0.25);
      stroke: #0d9488;
      stroke-width: 2;
      stroke-dasharray: 6 4;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      rx: 5px;
      ry: 5px;
    }

    .verse-box:hover {
      fill: rgba(13, 148, 136, 0.5) !important;
      stroke-width: 3;
    }

    .verse-box.playing {
      fill: rgba(234, 179, 8, 0.65) !important;
      stroke: #ca8a04 !important;
      stroke-dasharray: none;
    }

    .verse-text {
      fill: #ffffff;
      font-size: 16px;
      font-weight: bold;
      font-family: sans-serif;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>

  <div id="mushaf-section">
    <div class="mushaf-card">
      <div class="mushaf-header">
        <span class="header-badge" id="surah-title">112. Al-Ikhlāṣ</span>
        <span class="header-badge" id="page-title">Hal. 604</span>
        <span class="header-badge">Juz 30</span>
      </div>

      <div class="mushaf-container">
        <img id="mushaf-img" class="mushaf-img" src="" alt="Mushaf Image">
        <svg id="svg-overlay" class="svg-overlay" viewBox="0 0 1024 1460"></svg>
      </div>
    </div>
  </div>

  <script>
     const SUPABASE_URL = 'https://wltnavoogxvoymhcdfwz.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdG5hdm9vZ3h2b3ltaGNkZnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTE3ODEsImV4cCI6MjEwNTI4Nzc4MX0.7B7TdYafWjuRMOrInLo_u8f0d_WwRizqzdzABTITfpI';


    let supabaseClient = null;
    if (SUPABASE_KEY && !SUPABASE_KEY.includes('ISI_ANON_KEY')) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    }

    let currentAudio = null;

    // FUNGSI UTAMA: Load Halaman & JSON Koordinat Secara Otomatis
    async function loadMushafPage(pageNumber) {
      try {
        // 1. Load Gambar Mushaf
        const imgEl = document.getElementById('mushaf-img');
        imgEl.src = `https://android.quran.com/data/width_1024/page${pageNumber}.png`;

        // 2. Fetch Dataset JSON Koordinat Halaman
       const response = await fetch(`./data/page${pageNumber}.json`);
        const pageData = await response.json();

        // 3. Render Area Klik SVG
        renderSVGOverlay(pageData.ayahs);
      } catch (err) {
        console.error("Gagal memuat dataset JSON halaman:", err);
      }
    }

    // Render Komponen SVG dari Data JSON
    function renderSVGOverlay(ayahList) {
      const svg = document.getElementById('svg-overlay');
      svg.innerHTML = '';

      ayahList.forEach(item => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        
        // Kotak Area
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', item.x);
        rect.setAttribute('y', item.y);
        rect.setAttribute('width', item.w);
        rect.setAttribute('height', item.h);
        rect.setAttribute('class', 'verse-box');
        rect.setAttribute('data-verse', `${item.surah}:${item.ayah}`);

        // Badge Tag Label
        const badge = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        badge.setAttribute('x', item.x + 10);
        badge.setAttribute('y', item.y + (item.h / 2) - 13);
        badge.setAttribute('width', 80);
        badge.setAttribute('height', 26);
        badge.setAttribute('rx', 4);
        badge.setAttribute('fill', 'rgba(0, 0, 0, 0.75)');

        // Teks Label
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', item.x + 50);
        text.setAttribute('y', item.y + (item.h / 2) + 1);
        text.setAttribute('class', 'verse-text');
        text.textContent = item.label;

        g.addEventListener('click', () => {
          highlightVerse(item.surah, item.ayah);
          playAudioAyat(item.surah, item.ayah);
        });

        g.appendChild(rect);
        g.appendChild(badge);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    async function playAudioAyat(surahNumber, ayahNumber) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      let audioSrc = null;

      if (supabaseClient) {
        try {
          const { data } = supabaseClient
            .storage
            .from('quran-audio')
            .getPublicUrl(`${surahNumber}/${ayahNumber}.mp3`);

          if (data?.publicUrl) {
            audioSrc = data.publicUrl;
          }
        } catch (e) {
          console.warn("Supabase Storage Error:", e);
        }
      }

      if (!audioSrc || audioSrc.includes('undefined')) {
        const fallbackId = ayahNumber === 0 ? 1 : 6221 + (ayahNumber - 1);
        audioSrc = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${fallbackId}.mp3`;
      }

      currentAudio = new Audio(audioSrc);
      currentAudio.play().catch(err => console.error("Gagal memutar audio:", err));
    }

    function highlightVerse(surah, ayah) {
      document.querySelectorAll('.verse-box').forEach(el => el.classList.remove('playing'));
      const activeEl = document.querySelector(`.verse-box[data-verse="${surah}:${ayah}"]`);
      if (activeEl) {
        activeEl.classList.add('playing');
      }
    }

    // Panggil Halaman 604 saat dimuat
    loadMushafPage(604);
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TALQINKU - Kurniapedia</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #030712;
      --bg-radial-1: rgba(0, 240, 255, 0.12);
      --bg-radial-2: rgba(0, 255, 204, 0.1);
      --card-glass: rgba(15, 23, 42, 0.65);
      --card-glass-hover: rgba(15, 23, 42, 0.85);
      --card-border: rgba(56, 189, 248, 0.25);
      --neon-primary: #00f0ff;
      --neon-secondary: #00ffcc;
      --text-main: #f3f4f6;
      --text-arabic: #ffffff;
      --text-muted: #9ca3af;
      --accent-gold: #fbbf24;
      --glass-blur: blur(16px);
      --glow-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
      --dropdown-bg: #0f172a;
      --btn-glass-bg: rgba(0, 240, 255, 0.08);
      --btn-glass-border: rgba(0, 240, 255, 0.35);
      --btn-glass-shadow: 0 8px 32px 0 rgba(0, 240, 255, 0.2), inset 0 0 12px 0 rgba(255, 255, 255, 0.25);
      --btn-glass-active-bg: rgba(0, 255, 204, 0.2);
    }

    body.theme-light {
      --bg-dark: #f8fafc;
      --bg-radial-1: rgba(236, 72, 153, 0.06);
      --bg-radial-2: rgba(217, 70, 239, 0.06);
      --card-glass: rgba(255, 255, 255, 0.8);
      --card-glass-hover: rgba(255, 255, 255, 0.95);
      --card-border: rgba(203, 213, 225, 0.8);
      --neon-primary: #a855f7;
      --neon-secondary: #ec4899;
      --text-main: #1e293b;
      --text-arabic: #0f172a;
      --text-muted: #64748b;
      --accent-gold: #d97706;
      --glow-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
      --dropdown-bg: #ffffff;
      --btn-glass-bg: rgba(241, 245, 249, 0.9);
      --btn-glass-border: rgba(203, 213, 225, 0.9);
      --btn-glass-shadow: 0 2px 4px rgba(0, 0, 0, 0.04);
      --btn-glass-active-bg: rgba(233, 213, 255, 0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, var(--bg-radial-1) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, var(--bg-radial-2) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.05) 0%, var(--bg-dark) 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding-bottom: 140px;
      min-height: 100vh;
      transition: background-color 0.4s ease, color 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .navbar {
      background: rgba(3, 7, 18, 0.4);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--card-border);
      padding: 14px 24px 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    body.theme-light .navbar { background: rgba(255, 255, 255, 0.7); }

    .brand-section { display: flex; flex-direction: column; gap: 4px; }
    .brand {
      font-size: 28px;
      text-transform: uppercase;
      font-weight: 700;
      background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-subtext { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    .surah-selector-wrapper {
      position: sticky;
      top: 75px;
      z-index: 20;
      max-width: 800px;
      margin: 12px auto 0 auto;
      padding: 0 20px;
      width: 100%;
      display: flex;
      pointer-events: none;
    }

    .surah-selector-container {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--card-glass);
      backdrop-filter: var(--glass-blur);
      padding: 10px 18px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      font-size: 14px;
      font-weight: 600;
    }

    .surah-selector-container label { color: var(--neon-primary); text-transform: uppercase; font-size: 12px; }
    .surah-selector-container select { background: transparent; color: var(--text-main); border: none; outline: none; font-size: 16px; font-weight: 700; cursor: pointer; }
    .surah-selector-container select option { background: var(--dropdown-bg); color: var(--text-main); }

    .nav-controls { display: flex; align-items: center; gap: 10px; }

    .glass-btn {
      background: var(--btn-glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--btn-glass-border);
      box-shadow: var(--btn-glass-shadow);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .glass-btn:hover { border-color: var(--neon-primary); transform: translateY(-2px); }
    .glass-btn.active, .glass-btn.saved { background: var(--btn-glass-active-bg); border-color: var(--neon-secondary); }
    .glass-btn.saved svg { fill: var(--accent-gold); stroke: var(--accent-gold); }
    .glass-btn svg { width: 20px; height: 20px; stroke: var(--neon-primary); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .glass-btn svg.icon-fill-stop { fill: var(--neon-primary); }
    .glass-btn.round { border-radius: 50%; }

    .container { max-width: 800px; margin: 16px auto; padding: 0 20px; flex: 1; width: 100%; }

    .surah-header-standalone { text-align: center; margin-bottom: 24px; padding: 10px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    
    .surah-title-ar {
      font-family: 'Scheherazade New', serif !important;
      font-size: 42px !important;
      font-weight: 400 !important;
      color: var(--neon-secondary);
      direction: rtl;
      line-height: 1.5;
    }

    .surah-subtitle { color: var(--text-muted); font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }

    .ayah-card {
      background: var(--card-glass);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
    }
    .ayah-card.bismillah-card { border-color: rgba(251, 191, 36, 0.3); }
    .ayah-card.active { border-color: var(--neon-secondary); box-shadow: var(--glow-shadow); }

    .ayah-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    .ayah-actions { display: flex; align-items: center; gap: 10px; }
    .ayah-key { padding: 0 12px; height: 36px; border-radius: 12px; background: var(--btn-glass-bg); border: 1px solid var(--btn-glass-border); color: var(--neon-primary); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

    .ayah-arabic {
      font-family: 'Scheherazade New', serif !important;
      font-weight: 400 !important;
      font-size: 36px !important;
      direction: rtl;
      text-align: right;
      line-height: 2.6 !important;
      color: var(--text-arabic);
      margin-bottom: 16px;
    }

    .bismillah-text { text-align: center; color: var(--accent-gold); font-size: 38px !important; font-weight: 400 !important; }
    .ayah-number-icon { font-family: 'Scheherazade New', serif !important; font-weight: 400 !important; display: inline-block; margin-right: 8px; color: var(--neon-secondary); font-size: 30px; }
    .ayah-translation { font-size: 15px; color: var(--text-muted); line-height: 1.7; }
    .ayah-translation.hidden { display: none; }

    /* Modal Bookmark Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--dropdown-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: var(--neon-primary); }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; }
    .bookmark-item {
      background: var(--card-glass);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .bookmark-item:hover { border-color: var(--neon-secondary); transform: translateX(4px); }
    .bookmark-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; padding-right: 12px; }
    .bookmark-title { font-weight: 600; font-size: 14px; color: var(--text-main); }
    .bookmark-sub { font-size: 12px; color: var(--text-muted); }
    
    /* Tombol Tanda Silang Hapus Bookmark */
    .bookmark-delete {
      background: var(--btn-glass-bg);
      border: 1px solid var(--btn-glass-border);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .bookmark-delete:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: #ef4444;
      color: #ef4444;
      transform: scale(1.05);
    }
    .bookmark-delete svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .bottom-player {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 800px;
      background: var(--card-glass);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12), var(--glow-shadow);
      z-index: 100;
      gap: 16px;
    }

    .player-left-content { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
    .player-info { display: flex; flex-direction: column; }
    .player-title { font-size: 14px; font-weight: 600; color: var(--neon-primary); }
    .player-subtitle { font-size: 12px; color: var(--text-muted); }
    .player-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; }

    .repeat-mode-select {
      background: var(--btn-glass-bg);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      border: 1px solid var(--btn-glass-border);
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .repeat-mode-select option { background: var(--dropdown-bg); color: var(--text-main); }

    .range-picker {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--btn-glass-bg);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid var(--btn-glass-border);
    }
    .range-picker select { background: transparent; color: var(--neon-secondary); border: none; outline: none; font-size: 13px; font-weight: 700; cursor: pointer; }
    .range-picker select option { background: var(--dropdown-bg); color: var(--text-main); }

    .main-play-btn { width: 48px; height: 48px; flex-shrink: 0; align-self: center; }
    .main-play-btn svg { width: 24px; height: 24px; }
    #audio-element { display: none; }
  </style>
</head>
<body>

  <svg style="display: none;">

    <symbol id="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="var(--neon-primary)"></rect></symbol>
    <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></symbol>

  </svg>

  <nav class="navbar">
    <div class="brand-section">
      <div class="brand"><span class="brand-icon">☆</span> TALQINKU</div>
      <div class="header-subtext">Kurniapedia | 2026</div>
    </div>
    <div class="nav-controls">
      <button class="glass-btn round" id="bookmarkListBtn" onclick="toggleBookmarkModal()" title="Daftar Bookmark"><svg><use href="#icon-bookmark"></use></svg></button>
      <button class="glass-btn round" id="globalTransToggleBtn" onclick="toggleGlobalTranslation()" title="Terjemahan"><svg><use href="#icon-globe"></use></svg></button>
      <button class="glass-btn round" id="themeToggleBtn" onclick="toggleTheme()" title="Tema"><svg id="themeIcon"><use href="#icon-moon"></use></svg></button>
    </div>
  </nav>

  <!-- Modal Bookmark -->
  <div class="modal-overlay" id="bookmarkModal" onclick="handleModalOutsideClick(event)">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">DAFTAR BOOKMARK</div>
        <button class="glass-btn round" onclick="toggleBookmarkModal()" style="width: 32px; height: 32px;"><svg style="width: 16px; height: 16px;"><use href="#icon-close"></use></svg></button>
      </div>
      <div class="modal-body" id="bookmarkListContainer">
        <!-- List bookmarks akan dimuat secara dinamis disini -->
      </div>
    </div>
  </div>

  <div class="surah-selector-wrapper">
    <div class="surah-selector-container">
      <label for="surahSelect">Pilih Surat:</label>
      <select id="surahSelect" onchange="changeSurah()"></select>
    </div>
  </div>

  <div class="container">
    <div class="surah-header-standalone" id="surahHeader">
      <div class="surah-title-ar" id="surahTitleAr">سُورَةُ ٱلْفَاتِحَةِ</div>
      <div class="surah-subtitle" id="surahSubtitle">Al-Fatihah • Surah 1 • 7 Ayat</div>
    </div>
    <div id="ayahs-container"><p style="text-align: center; color: var(--text-muted);">Memuat ayat...</p></div>
  </div>

  <div class="bottom-player">
    <div class="player-left-content">
      <div class="player-info">
        <div class="player-title" id="player-title">Pilih ayat untuk memutar</div>
        <div class="player-subtitle" id="player-status">Dihentikan</div>
      </div>
      <div class="player-controls">
        <select id="repeatMode" class="repeat-mode-select" onchange="handleRepeatModeChange()">
          <option value="single">Ulang ayat</option>
          <option value="surah">Ulang surat</option>
          <option value="range">Pilih ayat</option>
        </select>
        <div class="range-picker" id="rangePicker">
          <span>Ayat:</span>
          <select id="startAyahSelect"></select>
          <span>s/d</span>
          <select id="endAyahSelect"></select>
        </div>
      </div>
    </div>
    <button class="glass-btn round main-play-btn" id="masterPlayBtn" onclick="toggleMasterPlay()">
      <svg id="masterPlaySvg"><use id="masterPlayIcon" href="#icon-play"></use></svg>
    </button>
  </div>

  <audio id="audio-element"></audio>

      { num: 84, name: "Al-Insyiqaq", ar: "سُورَةُ ٱلْإِنْشِقَاقِ", ayahs: 25 },
      { num: 85, name: "Al-Buruj", ar: "سُورَةُ ٱلْبُرُوجِ", ayahs: 22 },
      { num: 86, name: "At-Tariq", ar: "سُورَةُ ٱلطَّارِقِ", ayahs: 17 },
      { num: 87, name: "Al-A'la", ar: "سُورَةُ ٱلْأَعْلَىٰ", ayahs: 19 },
      { num: 88, name: "Al-Gasyiyah", ar: "سُورَةُ ٱلْغَاشِيَةِ", ayahs: 26 },
      { num: 89, name: "Al-Fajr", ar: "سُورَةُ ٱلْفَجْرِ", ayahs: 30 },
      { num: 90, name: "Al-Balad", ar: "سُورَةُ ٱلْبَلَدِ", ayahs: 20 },
      { num: 91, name: "Asy-Syams", ar: "سُورَةُ ٱلشَّمْسِ", ayahs: 15 },
      { num: 92, name: "Al-Lail", ar: "سُورَةُ ٱلَّيْلِ", ayahs: 21 },
      { num: 93, name: "Ad-Duha", ar: "سُورَةُ ٱلضُّحَىٰ", ayahs: 11 },
      { num: 94, name: "Asy-Syarh", ar: "سُورَةُ ٱلشَّرْحِ", ayahs: 8 },
      { num: 95, name: "At-Tin", ar: "سُورَةُ ٱلتِّينِ", ayahs: 8 },
      { num: 96, name: "Al-'Alaq", ar: "سُورَةُ ٱلْعَلَقِ", ayahs: 19 },
      { num: 97, name: "Al-Qadr", ar: "سُورَةُ ٱلْقَدْرِ", ayahs: 5 },
      { num: 98, name: "Al-Bayyinah", ar: "سُورَةُ ٱلْبَيِّنَةِ", ayahs: 8 },
      { num: 99, name: "Az-Zalzalah", ar: "سُورَةُ ٱلزَّلْزَلَةِ", ayahs: 8 },
      { num: 100, name: "Al-'Adiyat", ar: "سُورَةُ ٱلْعَادِيَاتِ", ayahs: 11 },
      { num: 101, name: "Al-Qari'ah", ar: "سُورَةُ ٱلْقَارِعَةِ", ayahs: 11 },
      { num: 102, name: "At-Takasur", ar: "سُورَةُ ٱلتَّكَاثُرِ", ayahs: 8 },
      { num: 103, name: "Al-'Asr", ar: "سُورَةُ ٱلْعَصْرِ", ayahs: 3 },
      { num: 104, name: "Al-Humazah", ar: "سُورَةُ ٱلْهُمَزَةِ", ayahs: 9 },
      { num: 105, name: "Al-Fil", ar: "سُورَةُ ٱلْفِيلِ", ayahs: 5 },
      { num: 106, name: "Quraisy", ar: "سُورَةُ قُرَيْشٍ", ayahs: 4 },
      { num: 107, name: "Al-Ma'un", ar: "سُورَةُ ٱلْمَاعُونِ", ayahs: 7 },
      { num: 108, name: "Al-Kausar", ar: "سُورَةُ ٱلْكَوْثَرِ", ayahs: 3 },
      { num: 109, name: "Al-Kafirun", ar: "سُورَةُ ٱلْكَافِرُونَ", ayahs: 6 },
      { num: 110, name: "An-Nasr", ar: "سُورَةُ ٱلنَّصْرِ", ayahs: 3 },
      { num: 111, name: "Al-Lahab", ar: "سُورَةُ ٱللَّهَبِ", ayahs: 5 },
      { num: 112, name: "Al-Ikhlas", ar: "سُورَةُ ٱلْإِخْلَاصِ", ayahs: 4 },
      { num: 113, name: "Al-Falaq", ar: "سُورَةُ ٱلْفَلَقِ", ayahs: 5 },
      { num: 114, name: "An-Nas", ar: "سُورَةُ ٱلنَّاسِ", ayahs: 6 }
    ];

    let currentSurahNum = 1; 
    let currentTotalAyahs = 7;
    let currentAyah = null; 
    let isPlaying = false;
    let showTranslations = localStorage.getItem('show_translations') !== 'false';
    let savedAyahs = JSON.parse(localStorage.getItem('saved_ayahs') || '[]');

    const audioElement = document.getElementById('audio-element');
    const playerTitle = document.getElementById('player-title');
    const playerStatus = document.getElementById('player-status');
    const masterPlaySvg = document.getElementById('masterPlaySvg');
    const masterPlayIcon = document.getElementById('masterPlayIcon');
    const surahSelect = document.getElementById('surahSelect');
    const repeatModeSelect = document.getElementById('repeatMode');
    const rangePicker = document.getElementById('rangePicker');
    const startAyahSelect = document.getElementById('startAyahSelect');
    const endAyahSelect = document.getElementById('endAyahSelect');
    const themeIcon = document.getElementById('themeIcon');
    const globalTransToggleBtn = document.getElementById('globalTransToggleBtn');
    const bookmarkModal = document.getElementById('bookmarkModal');
    const bookmarkListContainer = document.getElementById('bookmarkListContainer');

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('theme-light');
        themeIcon.setAttribute('href', '#icon-sun');
      } else {
        document.body.classList.remove('theme-light');
        themeIcon.setAttribute('href', '#icon-moon');
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('theme-light');
      const isLight = document.body.classList.contains('theme-light');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      themeIcon.setAttribute('href', isLight ? '#icon-sun' : '#icon-moon');
    }

    function initTranslationState() { updateGlobalTransBtnUI(); }

    function toggleGlobalTranslation() {
      showTranslations = !showTranslations;
      localStorage.setItem('show_translations', showTranslations);
      updateGlobalTransBtnUI();
      document.querySelectorAll('.ayah-translation').forEach(el => {
        if (showTranslations) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
    }

    function updateGlobalTransBtnUI() {
      if (showTranslations) {
        globalTransToggleBtn.classList.add('active');
        globalTransToggleBtn.title = 'Sembunyikan Semua Terjemahan';
      } else {
        globalTransToggleBtn.classList.remove('active');
        globalTransToggleBtn.title = 'Tampilkan Semua Terjemahan';
      }
    }

    function toggleBookmarkModal() {
      bookmarkModal.classList.toggle('open');
      if (bookmarkModal.classList.contains('open')) {
        renderBookmarkList();
      }
    }

    function handleModalOutsideClick(event) {
      if (event.target === bookmarkModal) {
        toggleBookmarkModal();
      }
    }

    function renderBookmarkList() {
      if (savedAyahs.length === 0) {
        bookmarkListContainer.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">Belum ada bookmark</p>`;
        return;
      }

      let html = '';
      savedAyahs.forEach(itemKey => {
        const [sNum, aNum] = itemKey.split(':').map(Number);
        const surah = ALL_SURAHS.find(s => s.num === sNum);
        const surahName = surah ? surah.name : `Surah ${sNum}`;
        const ayahText = aNum === 0 ? 'Bismillah' : `Ayat ${aNum}`;

        html += `
          <div class="bookmark-item" onclick="jumpToBookmark(${sNum}, ${aNum})">
            <div class="bookmark-info">
              <div class="bookmark-title">${surahName} (${sNum}:${aNum})</div>
              <div class="bookmark-sub">Surah ${surahName} • ${ayahText}</div>
            </div>
            <button class="bookmark-delete" onclick="event.stopPropagation(); removeBookmarkItem('${itemKey}')" title="Hapus Bookmark">
              <svg><use href="#icon-close"></use></svg>
            </button>
          </div>
        `;
      });
      bookmarkListContainer.innerHTML = html;
    }

    function removeBookmarkItem(itemKey) {
      const index = savedAyahs.indexOf(itemKey);
      if (index > -1) {
        savedAyahs.splice(index, 1);
        localStorage.setItem('saved_ayahs', JSON.stringify(savedAyahs));
        renderBookmarkList();
        const [sNum, aNum] = itemKey.split(':').map(Number);
        if (currentSurahNum === sNum) {
          updateBookmarkUI(aNum);
        }
      }
    }

    async function jumpToBookmark(surahNum, ayahNum) {
      toggleBookmarkModal();
      if (currentSurahNum !== surahNum) {
        currentSurahNum = surahNum;
        surahSelect.value = surahNum;
        const surahData = ALL_SURAHS.find(s => s.num === currentSurahNum);
        if (surahData) currentTotalAyahs = surahData.ayahs;
        stopAudio();
        await loadSurah();
      }
      
      setTimeout(() => {
        const card = document.getElementById(`ayah-card-${ayahNum}`);
        if (card) {
          document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 100);
    }

    function populateSurahDropdown() {
      surahSelect.innerHTML = '';
      ALL_SURAHS.forEach(s => {
        const option = document.createElement('option');
        option.value = s.num;
        option.textContent = `${s.num}. ${s.name}`;
        if (s.num === currentSurahNum) option.selected = true;
        surahSelect.appendChild(option);
      });
    }

    function setupRangeSelector() {
      startAyahSelect.innerHTML = '';
      endAyahSelect.innerHTML = '';
      for (let i = 1; i <= currentTotalAyahs; i++) {
        startAyahSelect.innerHTML += `<option value="${i}">${i}</option>`;
        endAyahSelect.innerHTML += `<option value="${i}">${i}</option>`;
      }
      startAyahSelect.value = 1;
      endAyahSelect.value = currentTotalAyahs;

      startAyahSelect.onchange = () => {
        if (parseInt(startAyahSelect.value) > parseInt(endAyahSelect.value)) endAyahSelect.value = startAyahSelect.value;
      };
      endAyahSelect.onchange = () => {
        if (parseInt(endAyahSelect.value) < parseInt(startAyahSelect.value)) startAyahSelect.value = endAyahSelect.value;
      };
    }

    function handleRepeatModeChange() {
      rangePicker.style.display = repeatModeSelect.value === 'range' ? 'flex' : 'none';
    }

    function changeSurah() {
      currentSurahNum = parseInt(surahSelect.value);
      const surahData = ALL_SURAHS.find(s => s.num === currentSurahNum);
      if (surahData) currentTotalAyahs = surahData.ayahs;
      stopAudio();
      loadSurah();
    }

    function getAudioUrl(surahNumber, ayahNumber) {
      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET_NAME}/${surahNumber}/${ayahNumber}.mp3`;
    }

    function toggleSaveAyah(ayahNum) {
      const itemKey = `${currentSurahNum}:${ayahNum}`;
      const index = savedAyahs.indexOf(itemKey);
      if (index > -1) savedAyahs.splice(index, 1);
      else savedAyahs.push(itemKey);
      localStorage.setItem('saved_ayahs', JSON.stringify(savedAyahs));
      updateBookmarkUI(ayahNum);
    }

    function updateBookmarkUI(ayahNum) {
      const itemKey = `${currentSurahNum}:${ayahNum}`;
      const btn = document.getElementById(`btn-bookmark-${ayahNum}`);
      if (btn) {
        if (savedAyahs.includes(itemKey)) btn.classList.add('saved');
        else btn.classList.remove('saved');
      }
    }

    function applyIndonesianQuranStandards(text) {
      return text
        .replace(/اللَّهِ/g, 'اللَّٰهِ')
        .replace(/اللَّهُ/g, 'اللَّٰهُ')
        .replace(/اللََّ/g, 'اللََّٰ')
        .replace(/ٱللَّهِ/g, 'ٱللَّٰهِ')
        .replace(/ٱللَّهُ/g, 'ٱللَّٰهُ');
    }

    async function loadSurah() {
      const surahInfo = ALL_SURAHS.find(s => s.num === currentSurahNum);
      document.getElementById('surahTitleAr').innerText = surahInfo.ar;
      document.getElementById('surahSubtitle').innerText = `${surahInfo.name} • Surah ${surahInfo.num} • ${surahInfo.ayahs} Ayat`;

      setupRangeSelector();
      const container = document.getElementById('ayahs-container');
      container.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Memuat ayat...</p>`;

      try {
        const [resArab, resIndo] = await Promise.all([
          fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${currentSurahNum}`),
          fetch(`https://api.alquran.cloud/v1/surah/${currentSurahNum}/id.indonesian`)
        ]);

        const dataArab = await resArab.json();
        const dataIndo = await resIndo.json();
        const ayahsArab = dataArab.verses;
        const ayahsIndo = dataIndo.data.ayahs;

        let html = '';
        const transHiddenClass = showTranslations ? '' : 'hidden';

        if (currentSurahNum !== 9) {
          const itemKey0 = `${currentSurahNum}:0`;
          const isBismillahSaved = savedAyahs.includes(itemKey0);
          html += `
            <div class="ayah-card bismillah-card" id="ayah-card-0">
              <div class="ayah-top-bar">
                <div class="ayah-key">${currentSurahNum}:0</div>
                <div class="ayah-actions">
                  <button class="glass-btn ${isBismillahSaved ? 'saved' : ''}" id="btn-bookmark-0" onclick="toggleSaveAyah(0)"><svg><use href="#icon-bookmark"></use></svg></button>
                  <button class="glass-btn round" id="btn-play-0" onclick="playAyah(0)"><svg id="icon-play-0"><use href="#icon-play"></use></svg></button>
                </div>
              </div>
              <div class="ayah-arabic bismillah-text">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
              <div class="ayah-translation ${transHiddenClass}" id="translation-0">Dengan nama Allah Yang Maha Pengasih, Maha Penyayang.</div>
            </div>`;
        }

        ayahsArab.forEach((ayah, idx) => {
          const ayahNum = idx + 1;
          let formattedText = ayah.text_uthmani;
          
          if (currentSurahNum !== 1 && currentSurahNum !== 9 && idx === 0) {
            formattedText = formattedText.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*/, '');
          }
          
          formattedText = applyIndonesianQuranStandards(formattedText);
          const endOfAyahSymbol = `\u06DD${toArabicDigits(ayahNum)}`;
          const itemKey = `${currentSurahNum}:${ayahNum}`;
          const isSaved = savedAyahs.includes(itemKey);

          html += `
            <div class="ayah-card" id="ayah-card-${ayahNum}">
              <div class="ayah-top-bar">
                <div class="ayah-key">${currentSurahNum}:${ayahNum}</div>
                <div class="ayah-actions">
                  <button class="glass-btn ${isSaved ? 'saved' : ''}" id="btn-bookmark-${ayahNum}" onclick="toggleSaveAyah(${ayahNum})"><svg><use href="#icon-bookmark"></use></svg></button>
                  <button class="glass-btn round" id="btn-play-${ayahNum}" onclick="playAyah(${ayahNum})"><svg id="icon-play-${ayahNum}"><use href="#icon-play"></use></svg></button>
                </div>
              </div>
              <div class="ayah-arabic">${formattedText} <span class="ayah-number-icon">${endOfAyahSymbol}</span></div>
              <div class="ayah-translation ${transHiddenClass}" id="translation-${ayahNum}">${ayahNum}. ${ayahsIndo[idx].text}</div>
            </div>`;
        });

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = `<p style="text-align:center; color:#ef4444;">Gagal memuat ayat. Periksa koneksi internet Anda.</p>`;
      }
    }

    function setBtnPlayIcon(ayahNum, isPause) {
      const iconUse = document.querySelector(`#icon-play-${ayahNum} use`);
      if (iconUse) iconUse.setAttribute('href', isPause ? '#icon-pause' : '#icon-play');
    }

    function playAyah(ayahNum) {
      if (currentAyah === ayahNum && isPlaying) { stopAudio(); return; }
      if (currentAyah !== null) setBtnPlayIcon(currentAyah, false);

      currentAyah = ayahNum;
      document.querySelectorAll('.ayah-card').forEach(card => card.classList.remove('active'));
      const currentCard = document.getElementById(`ayah-card-${ayahNum}`);
      
      if (currentCard) {
        currentCard.classList.add('active');
        currentCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      setBtnPlayIcon(ayahNum, true);

      const surahInfo = ALL_SURAHS.find(s => s.num === currentSurahNum);
      playerTitle.innerText = `${surahInfo.name} : ${ayahNum === 0 ? "Bismillah" : `Ayat ${ayahNum}`}`;
      playerStatus.innerText = "Memutar audio...";
      
      masterPlayIcon.setAttribute('href', '#icon-stop');
      masterPlaySvg.classList.add('icon-fill-stop');

      audioElement.src = getAudioUrl(currentSurahNum, ayahNum);
      audioElement.play().then(() => { isPlaying = true; }).catch(() => {
        isPlaying = false;
        masterPlayIcon.setAttribute('href', '#icon-play');
        masterPlaySvg.classList.remove('icon-fill-stop');
        setBtnPlayIcon(ayahNum, false);
        playerStatus.innerText = "Gagal memutar audio";
      });
    }

    function stopAudio() {
      audioElement.pause();
      audioElement.currentTime = 0;
      isPlaying = false;
      masterPlayIcon.setAttribute('href', '#icon-play');
      masterPlaySvg.classList.remove('icon-fill-stop');
      if (currentAyah !== null) {
        setBtnPlayIcon(currentAyah, false);
        const card = document.getElementById(`ayah-card-${currentAyah}`);
        if (card) card.classList.remove('active');
      }
      currentAyah = null;
      playerTitle.innerText = "Pilih ayat untuk memutar";
      playerStatus.innerText = "Dihentikan";
    }

    function toggleMasterPlay() {
      if (isPlaying) { stopAudio(); return; }
      playAyah(repeatModeSelect.value === 'range' ? parseInt(startAyahSelect.value) : (currentSurahNum === 9 ? 1 : 0));
    }

    audioElement.onended = () => {
      isPlaying = false;
      masterPlayIcon.setAttribute('href', '#icon-play');
      masterPlaySvg.classList.remove('icon-fill-stop');
      if (currentAyah !== null) setBtnPlayIcon(currentAyah, false);

      const mode = repeatModeSelect.value;
      
      if (mode === 'single') {
        playAyah(currentAyah);
      } 
      else if (mode === 'surah') {
        const hasBismillah = currentSurahNum !== 9;
        const minAyah = hasBismillah ? 0 : 1;

        if (currentAyah < currentTotalAyahs) {
          playAyah(currentAyah + 1);
        } else {
          playAyah(minAyah);
        }
      } 
      else if (mode === 'range') {
        const start = parseInt(startAyahSelect.value);
        const end = parseInt(endAyahSelect.value);
        playAyah(currentAyah < end ? currentAyah + 1 : start);
      }
    };

    function toArabicDigits(num) { return String(num).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }

    document.getElementById('surahSelect').addEventListener('change', changeSurah);

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initTranslationState();
      populateSurahDropdown();
      loadSurah();
    });
  </script>
</body>
</html>
